name: Verify beta delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require a version bump for Skill payload changes in a PR
        if: github.event_name == 'pull_request'
        run: |
          range="origin/${{ github.base_ref }}...HEAD"
          if ! git diff --quiet "$range" -- jilungang-debate-coach; then
            git diff --quiet "$range" -- VERSION && {
              echo "::error::Skill payload changes must include a VERSION change."
              exit 1
            }
          fi

      - name: Require a version bump for Skill payload changes on main
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          range="${{ github.event.before }}...${{ github.sha }}"
          if ! git diff --quiet "$range" -- jilungang-debate-coach; then
            git diff --quiet "$range" -- VERSION && {
              echo "::error::Skill payload changes must include a VERSION change."
              exit 1
            }
          fi

      - name: Run delivery unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build and verify Xiaohongshu distribution
        run: python3 scripts/build_xhs_package.py --root . --output "$RUNNER_TEMP/jilungang-debate-coach-xiaohongshu.zip"

      - name: Verify ordinary commit
        if: github.ref_type != 'tag'
        run: python3 scripts/verify_delivery.py

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: python3 scripts/verify_delivery.py --mode tag --ref-name "${{ github.ref_name }}"
